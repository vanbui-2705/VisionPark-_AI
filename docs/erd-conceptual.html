<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VisionPark — ERD mức khái niệm</title>
  <style>
    :root {
      --page: #eef1e8;
      --paper: #fffef8;
      --ink: #253126;
      --muted: #667267;
      --line: #66715f;
      --entity: #f1f88c;
      --entity-alt: #f8fbbd;
      --header: #d9e85f;
      --key: #6f9eb3;
      --shadow: rgba(36, 49, 38, 0.17);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--page);
      color: var(--ink);
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    .workspace {
      width: min(96vw, 1920px);
      padding: 20px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .title h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 2vw, 34px);
      letter-spacing: -0.02em;
    }

    .title p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .actions { display: flex; gap: 8px; }

    button {
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid #53624f;
      border-radius: 8px;
      background: #fffef8;
      color: #253126;
      font: 600 14px/1 "Segoe UI", sans-serif;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    button:hover { background: #f1f5dc; }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid #9bb7c3; outline-offset: 2px; }

    .canvas {
      overflow: auto;
      border: 1px solid #c9cfbe;
      border-radius: 12px;
      background: var(--paper);
      box-shadow: 0 18px 50px var(--shadow);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      min-width: 1100px;
      background: var(--paper);
    }

    .relationship {
      fill: none;
      stroke: var(--line);
      stroke-width: 3;
      stroke-dasharray: 9 8;
    }

    .relation-label rect {
      fill: #fffef8;
      stroke: #c2c9b7;
      stroke-width: 1.5;
      rx: 12;
    }

    .relation-label text {
      fill: #596357;
      font-size: 17px;
      font-style: italic;
      text-anchor: middle;
    }

    .card-shadow { filter: url(#cardShadow); }
    .entity-box { fill: var(--entity-alt); stroke: #778156; stroke-width: 3; }
    .entity-head { fill: var(--header); stroke: #778156; stroke-width: 3; }
    .entity-main .entity-box { fill: #f3f89d; stroke-width: 4; }
    .entity-main .entity-head { fill: #d7e451; stroke-width: 4; }
    .separator { stroke: #aab47c; stroke-width: 1.5; }

    .entity-title {
      fill: #273127;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
      font-size: 23px;
      text-anchor: middle;
    }

    .attribute {
      fill: #344035;
      font-size: 17px;
      font-weight: 500;
    }

    .attribute-muted { fill: #5d685e; font-size: 15px; }
    .icon-box { fill: var(--key); stroke: #4f7789; stroke-width: 1; rx: 2; }
    .icon-line { stroke: #edf7fa; stroke-width: 1.7; }

    .cardinality text {
      fill: #303a30;
      font-size: 17px;
      font-weight: 700;
      paint-order: stroke;
      stroke: #fffef8;
      stroke-width: 6px;
      stroke-linejoin: round;
    }

    .legend-title { font-size: 18px; font-weight: 700; fill: #364036; }
    .legend-text { font-size: 15px; fill: #596359; }

    @media (max-width: 900px) {
      .toolbar { align-items: flex-start; flex-direction: column; }
      .workspace { width: 100vw; padding: 10px; }
    }

    @media print {
      body { background: white; }
      .workspace { width: 100%; padding: 0; }
      .toolbar { display: none; }
      .canvas { border: 0; box-shadow: none; overflow: visible; }
      svg { min-width: 0; }
    }

    body.export-view { display: block; min-height: 0; background: var(--paper); }
    body.export-view .workspace { width: 1920px; height: 1080px; padding: 0; }
    body.export-view .toolbar { display: none; }
    body.export-view .canvas { border: 0; border-radius: 0; box-shadow: none; overflow: hidden; }
    body.export-view svg { width: 1920px; height: 1080px; min-width: 0; }
  </style>
</head>

  <script>
    if (new URLSearchParams(window.location.search).has('export')) {
      document.body.classList.add('export-view');
    }

    function serializedSvg() {
      const source = document.getElementById('erd').cloneNode(true);
      source.setAttribute('width', '1920');
      source.setAttribute('height', '1080');
      const css = document.querySelector('style').textContent;
      const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
      style.textContent = css;
      source.insertBefore(style, source.firstChild);
      return new XMLSerializer().serializeToString(source);
    }

    function saveBlob(blob, filename) {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    }

    function downloadSvg() {
      saveBlob(new Blob([serializedSvg()], { type: 'image/svg+xml;charset=utf-8' }), 'VisionPark-ERD-khai-niem.svg');
    }

    function downloadPng() {
      const image = new Image();
      const blob = new Blob([serializedSvg()], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      image.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 1920;
        canvas.height = 1080;
        const context = canvas.getContext('2d');
        context.fillStyle = '#fffef8';
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((png) => saveBlob(png, 'VisionPark-ERD-khai-niem.png'), 'image/png');
        URL.revokeObjectURL(url);
      };
      image.src = url;
    }
  </script>
